name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: flowhq, POSTGRES_PASSWORD: flowhq, POSTGRES_DB: flowhq_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowhq" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.lock pytest ruff
      - run: cd backend && ruff check . && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd frontend && npm ci && npm run lint && npm run build
